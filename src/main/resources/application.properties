spring.application.name=Comms


# --------------------------------------------------
# MySQL Database Connection
# --------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/project_one?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123Applepie
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# JPA / Hibernate Configuration
# --------------------------------------------------
# Validates entities against MySQL schema without dropping or altering existing tables
spring.jpa.hibernate.ddl-auto=validate

# Formats and prints executed SQL queries to the terminal for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------
# Server Port
# --------------------------------------------------
server.port=8080